<!DOCTYPE html>
<html lang="pt">
<head>
    <link rel="icon" type="image/png" href="favicon-32x32.png">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Serviços KOKARTE</title>
    
    <!-- Google Fonts Premium -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=Montserrat:wght@300;400;500;600;700&family=Lora:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        kokarteBg: '#0f2017',
                        kokarteCard: '#1d382b',
                        kokarteGold: '#D4AF37',
                        kokarteGoldHover: '#E5C158',
                        kokarteGoldLight: '#F0D080',
                        kokarteText: '#E8F1EC'
                    },
                    fontFamily: {
                        display: ['Playfair Display', 'serif'],
                        body: ['Lora', 'serif'],
                        sans: ['Montserrat', 'sans-serif']
                    }
                }
            }
        }
    </script>
    <style>
        /* ============================================
           GLASSMORPHISM PREMIUM
        ============================================ */
        .glass-premium {
            background: rgba(29, 56, 43, 0.88);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            border: 1px solid rgba(212, 175, 55, 0.12);
            box-shadow: 
                0 20px 60px rgba(0, 0, 0, 0.5),
                inset 0 1px 0 rgba(255, 255, 255, 0.04);
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .glass-premium:hover {
            border-color: rgba(212, 175, 55, 0.35);
            box-shadow: 0 24px 72px rgba(0, 0, 0, 0.6);
            transform: translateY(-3px);
        }

        /* ============================================
           BOTÕES — ESTILOS UNIFICADOS
        ============================================ */
        .btn-gold-primary {
            background: linear-gradient(145deg, #D4AF37, #B8952E);
            color: #0f2017;
            font-family: 'Montserrat', sans-serif;
            font-weight: 700;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            border: none;
            border-radius: 9999px;
            padding: 0.75rem 1.5rem;
            box-shadow: 0 8px 32px rgba(212, 175, 55, 0.35), 0 4px 12px rgba(0, 0, 0, 0.3);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            cursor: pointer;
            width: 100%;
        }
        .btn-gold-primary:hover {
            transform: translateY(-2px) scale(1.02);
            box-shadow: 0 12px 48px rgba(212, 175, 55, 0.45), 0 4px 16px rgba(0, 0, 0, 0.3);
            filter: brightness(1.08);
        }
        .btn-gold-primary:active { transform: scale(0.97); }

        /* ============================================
           VÍDEO DE FUNDO
        ============================================ */
        #background-video {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: -1;
            pointer-events: none;
        }
        body::before {
            content: "";
            position: fixed;
            inset: 0;
            background: rgba(7, 17, 12, 0.50);
            z-index: -1;
            pointer-events: none;
        }

        /* ============================================
           DIVIDER DOURADO
        ============================================ */
        .divider-gold {
            width: 60px;
            height: 2px;
            background: linear-gradient(90deg, transparent, #D4AF37, transparent);
            margin: 0 auto;
            opacity: 0.5;
        }

        /* ============================================
           ANIMAÇÕES
        ============================================ */
        .fade-in {
            animation: fadeIn 0.6s ease-out forwards;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .fade-in-delay-1 { animation-delay: 0.05s; }
        .fade-in-delay-2 { animation-delay: 0.1s; }
        .fade-in-delay-3 { animation-delay: 0.15s; }
        .fade-in-delay-4 { animation-delay: 0.2s; }
        .fade-in-delay-5 { animation-delay: 0.25s; }

        /* ============================================
           SCROLLBAR
        ============================================ */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #0f2017; }
        ::-webkit-scrollbar-thumb { background: #D4AF37; border-radius: 10px; }

        /* ============================================
           TEXTO EXPANDIR/COLAPSAR
        ============================================ */
        .text-collapsed {
            display: -webkit-box;
            -webkit-line-clamp: 4;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        .text-expanded {
            display: block;
        }

        /* ============================================
           BADGE DE DETALHES
        ============================================ */
        .badge-detail {
            background: rgba(212, 175, 55, 0.08);
            border: 1px solid rgba(212, 175, 55, 0.15);
            border-radius: 0.75rem;
            padding: 0.5rem;
            text-align: center;
            transition: all 0.3s ease;
        }
        .badge-detail:hover {
            border-color: rgba(212, 175, 55, 0.4);
            background: rgba(212, 175, 55, 0.12);
        }
    </style>
</head>
<body class="text-kokarteText min-h-screen font-sans overflow-x-hidden">

    <!-- Vídeo de Fundo -->
    <video id="background-video" autoplay muted loop playsinline preload="auto">
        <source src="fundomotion.mp4" type="video/mp4">
    </video>

    <div class="relative z-10 max-w-md mx-auto p-6 space-y-8">
        
        <!-- Header -->
        <header class="pt-6 fade-in">
            <a href="index.html" class="inline-flex items-center gap-2 text-kokarteGold/70 hover:text-white transition-colors text-sm font-sans tracking-wider mb-6">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path>
                </svg>
                Voltar ao Portal
            </a>
            <h1 class="text-3xl font-bold text-kokarteGold font-display">Nossos Serviços</h1>
            <div class="divider-gold my-3"></div>
            <p class="text-emerald-100/60 text-sm font-sans mt-2">Escolha o atendimento que melhor ressoa com o seu momento.</p>
        </header>

        <!-- Lista de Serviços (dinâmica) -->
        <div id="lista-servicos" class="space-y-6 fade-in fade-in-delay-1">
            <!-- Os serviços serão carregados aqui dinamicamente -->
            <div class="text-center p-10 glass-premium rounded-2xl">
                <p class="text-kokarteGold animate-pulse font-sans text-sm">A carregar serviços...</p>
            </div>
        </div>
    </div>

    <script>
        const NUMERO_WHATSAPP = "244936676628";
        
        // ============================================================
        // LER SERVIÇOS DO LOCALSTORAGE
        // ============================================================
        function lerServicos() {
            try {
                const dados = localStorage.getItem('kokarte_servicos');
                if (dados) {
                    return JSON.parse(dados);
                }
            } catch (e) {
                console.error('Erro ao ler serviços:', e);
            }
            
            // Fallback: serviços iniciais
            return [
                {
                    id: 1001,
                    titulo: "Consulta de Mapeamento Energético",
                    duracao: "60 minutos",
                    valor: "45.000 Kz",
                    descricaoBreve: "A Consulta de Mapeamento Energético é o primeiro passo para compreender o seu estado energético e identificar os bloqueios que podem estar a influenciar diferentes áreas da sua vida.",
                    descricaoCompleta: "A Consulta de Mapeamento Energético é o primeiro passo para compreender o seu estado energético e identificar os bloqueios que podem estar a influenciar diferentes áreas da sua vida.\n\nIntegra uma leitura do perfil energético, emocional, numerológico e kármico, com o objetivo de identificar padrões, bloqueios e desafios, compreender o momento atual de vida e trazer maior clareza sobre o propósito de vida.\n\nEsta análise cruza essas informações com uma avaliação energética realizada através da radiestesia. A consulta pode ser complementada com a Limpeza e Harmonização Energética para um trabalho mais profundo.",
                    imagem: "",
                    ativo: true
                },
                {
                    id: 1002,
                    titulo: "Reiki Tibetano",
                    duracao: "60 min",
                    valor: "59.000 Kz",
                    descricaoBreve: "O Reiki Tibetano é uma terapia energética que promove o equilíbrio do campo energético, favorecendo o relaxamento profundo, a libertação de tensões e o restabelecimento da harmonia entre corpo, mente e emoções.",
                    descricaoCompleta: "O Reiki Tibetano é uma terapia energética que promove o equilíbrio do campo energético, favorecendo o relaxamento profundo, a libertação de tensões e o restabelecimento da harmonia entre corpo, mente e emoções.\n\nCada sessão é adaptada às necessidades e ao momento de vida de cada pessoa, permitindo um trabalho personalizado de reequilíbrio energético, bem-estar e desenvolvimento pessoal.\n\nOferecemos duas modalidades: Sessão Completa (indicada para quem inicia o processo) e Sessão de Manutenção (para acompanhamento regular).",
                    imagem: "",
                    ativo: true
                },
                {
                    id: 1003,
                    titulo: "Programa de Transformação Pessoal",
                    duracao: "60-90 min/sessão",
                    valor: "150.000 Kz (pack 3)",
                    descricaoBreve: "O Programa de Transformação Pessoal é um acompanhamento individual e personalizado, criado para quem pretende transformar padrões repetitivos, crenças limitantes e bloqueios identificados.",
                    descricaoCompleta: "O Programa de Transformação Pessoal é um acompanhamento individual e personalizado, criado para quem pretende transformar padrões repetitivos, crenças limitantes e bloqueios identificados.\n\nO programa inicia-se com um pack de 3 sessões, onde trabalhamos reprogramação mental, gestão emocional, inteligência emocional e definição de metas. É um processo focado na mudança consistente e sustentável para uma vida com mais propósito.",
                    imagem: "",
                    ativo: true
                },
                {
                    id: 1004,
                    titulo: "Massagem Bioenergética com Cristais",
                    duracao: "60 min",
                    valor: "38.000 Kz",
                    descricaoBreve: "A Massagem Bioenergética combina técnicas de massagem terapêutica com trabalho energético e cristais, proporcionando um profundo estado de relaxamento e reequilíbrio da energia vital.",
                    descricaoCompleta: "A Massagem Bioenergética combina técnicas de massagem terapêutica com trabalho energético e cristais, proporcionando um profundo estado de relaxamento e reequilíbrio da energia vital.\n\nCada sessão integra aromaterapia e a aplicação personalizada de cristais, restaurando o fluxo energético e favorecendo uma sensação imediata de leveza, tranquilidade e renovação profunda.",
                    imagem: "",
                    ativo: true
                },
                {
                    id: 1005,
                    titulo: "RESET by KOKARTE",
                    duracao: "Grupo",
                    valor: "8.500 Kz",
                    descricaoBreve: "O RESET by KOKARTE é uma experiência de reconexão consigo mesmo, criada para desacelerar, libertar a tensão acumulada e restaurar o equilíbrio.",
                    descricaoCompleta: "O RESET by KOKARTE é uma experiência de reconexão consigo mesmo, criada para desacelerar, libertar a tensão acumulada e restaurar o equilíbrio.\n\nSessão focada em respiração, meditação guiada, visualização e alongamentos suaves. Um momento de pausa consciente para renovação interior.",
                    imagem: "",
                    ativo: true
                }
            ];
        }

        // ============================================================
        // CARREGAR SERVIÇOS NA PÁGINA
        // ============================================================
        function carregarServicos() {
            const container = document.getElementById('lista-servicos');
            if (!container) return;
            
            const servicos = lerServicos();
            const ativos = servicos.filter(s => s.ativo);

            if (ativos.length === 0) {
                container.innerHTML = `
                    <div class="glass-premium p-8 rounded-2xl text-center">
                        <p class="text-emerald-200/60 font-sans">Não existem serviços disponíveis de momento. Volte em breve!</p>
                    </div>
                `;
                return;
            }

            container.innerHTML = '';
            ativos.forEach((s, index) => {
                const delay = (index + 1) * 0.05;
                const descricao = s.descricaoCompleta || s.descricaoBreve || '';
                
                container.innerHTML += `
                    <div class="glass-premium p-6 rounded-2xl fade-in" style="animation-delay: ${delay}s">
                        ${s.imagem ? `<img src="${s.imagem}" class="w-full h-48 object-cover rounded-xl mb-4 opacity-90">` : ''}
                        <h3 class="text-xl font-bold text-white font-display mb-4">${s.titulo}</h3>
                        
                        <div class="grid grid-cols-2 gap-3 mb-4">
                            <div class="badge-detail">
                                <p class="text-[10px] uppercase text-kokarteGold font-bold tracking-wider font-sans">Duração</p>
                                <p class="text-sm font-semibold text-white font-sans">${s.duracao}</p>
                            </div>
                            <div class="badge-detail">
                                <p class="text-[10px] uppercase text-kokarteGold font-bold tracking-wider font-sans">Valor</p>
                                <p class="text-sm font-semibold text-white font-sans">${s.valor}</p>
                            </div>
                        </div>

                        <p id="desc-${s.id}" class="text-emerald-50 text-sm font-sans leading-relaxed mb-2 text-collapsed transition-all duration-300">
                            ${descricao.replace(/\n/g, '<br>')}
                        </p>
                        <button onclick="toggleText(this, 'desc-${s.id}')" class="text-kokarteGold text-xs font-bold font-sans tracking-wider underline mb-4 hover:text-kokarteGoldLight transition-colors">
                            Ver mais
                        </button>
                        <button onclick="agendarWhatsApp('${s.titulo}')" 
                                class="btn-gold-primary">
                            Agendar / Saber Mais
                        </button>
                    </div>
                `;
            });
        }

        // ============================================================
        // TOGGLE TEXTO
        // ============================================================
        function toggleText(btn, elementId) {
            const p = document.getElementById(elementId);
            if (!p) return;
            
            const isCollapsed = p.classList.contains('text-collapsed');
            
            if (isCollapsed) {
                p.classList.remove('text-collapsed');
                p.classList.add('text-expanded');
                btn.innerText = 'Ver menos';
            } else {
                p.classList.remove('text-expanded');
                p.classList.add('text-collapsed');
                btn.innerText = 'Ver mais';
            }
        }

        // ============================================================
        // WHATSAPP
        // ============================================================
        function agendarWhatsApp(nomeItem) {
            const mensagem = `Olá! Gostaria de agendar: *${nomeItem}*.`;
            const urlWhatsApp = `https://wa.me/${NUMERO_WHATSAPP}?text=${encodeURIComponent(mensagem)}`;
            window.open(urlWhatsApp, "_blank");
        }

        // ============================================================
        // INICIALIZAR
        // ============================================================
        document.addEventListener('DOMContentLoaded', carregarServicos);
    </script>

</body>
</html>
