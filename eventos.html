<!DOCTYPE html>
<html lang="pt">
<head>
    <link rel="icon" type="image/png" href="favicon-32x32.png">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eventos KOKARTE</title>
    
    <!-- Google Fonts Premium -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=Montserrat:wght@300;400;500;600;700&family=Lora:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        kokarteBg: '#0f2017',
                        kokarteCard: '#1d382b',
                        kokarteGold: '#D4AF37',
                        kokarteGoldHover: '#E5C158',
                        kokarteGoldLight: '#F0D080',
                        kokarteText: '#E8F1EC'
                    },
                    fontFamily: {
                        display: ['Playfair Display', 'serif'],
                        body: ['Lora', 'serif'],
                        sans: ['Montserrat', 'sans-serif']
                    }
                }
            }
        }
    </script>
    <style>
        /* ============================================
           GLASSMORPHISM PREMIUM
        ============================================ */
        .glass-premium {
            background: rgba(29, 56, 43, 0.88);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            border: 1px solid rgba(212, 175, 55, 0.12);
            box-shadow: 
                0 20px 60px rgba(0, 0, 0, 0.5),
                inset 0 1px 0 rgba(255, 255, 255, 0.04);
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .glass-premium:hover {
            border-color: rgba(212, 175, 55, 0.35);
            box-shadow: 0 24px 72px rgba(0, 0, 0, 0.6);
            transform: translateY(-3px);
        }

        /* ============================================
           BOTÕES — ESTILOS UNIFICADOS (iguais ao index)
        ============================================ */
        .btn-gold-primary {
            background: linear-gradient(145deg, #D4AF37, #B8952E);
            color: #0f2017;
            font-family: 'Montserrat', sans-serif;
            font-weight: 700;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            border: none;
            border-radius: 9999px;
            padding: 0.75rem 1.5rem;
            box-shadow: 0 8px 32px rgba(212, 175, 55, 0.35), 0 4px 12px rgba(0, 0, 0, 0.3);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            cursor: pointer;
            width: 100%;
        }
        .btn-gold-primary:hover {
            transform: translateY(-2px) scale(1.02);
            box-shadow: 0 12px 48px rgba(212, 175, 55, 0.45), 0 4px 16px rgba(0, 0, 0, 0.3);
            filter: brightness(1.08);
        }
        .btn-gold-primary:active { transform: scale(0.97); }

        .btn-gold-secondary {
            background: transparent;
            color: #D4AF37;
            font-family: 'Montserrat', sans-serif;
            font-weight: 600;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            border: 2px solid #D4AF37;
            border-radius: 9999px;
            padding: 0.75rem 1.5rem;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.25);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            cursor: pointer;
            width: 100%;
        }
        .btn-gold-secondary:hover {
            background: #D4AF37;
            color: #0f2017;
            transform: translateY(-2px) scale(1.02);
            box-shadow: 0 8px 32px rgba(212, 175, 55, 0.3);
        }
        .btn-gold-secondary:active { transform: scale(0.97); }

        /* ============================================
           VÍDEO DE FUNDO
        ============================================ */
        #background-video {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: -1;
            pointer-events: none;
        }
        body::before {
            content: "";
            position: fixed;
            inset: 0;
            background: rgba(7, 17, 12, 0.50);
            z-index: -1;
            pointer-events: none;
        }

        /* ============================================
           DIVIDER DOURADO
        ============================================ */
        .divider-gold {
            width: 60px;
            height: 2px;
            background: linear-gradient(90deg, transparent, #D4AF37, transparent);
            margin: 0 auto;
            opacity: 0.5;
        }

        /* ============================================
           ANIMAÇÕES
        ============================================ */
        .fade-in {
            animation: fadeIn 0.6s ease-out forwards;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .fade-in-delay-1 { animation-delay: 0.1s; }
        .fade-in-delay-2 { animation-delay: 0.2s; }
        .fade-in-delay-3 { animation-delay: 0.3s; }

        /* ============================================
           SCROLLBAR
        ============================================ */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #0f2017; }
        ::-webkit-scrollbar-thumb { background: #D4AF37; border-radius: 10px; }
    </style>
</head>
<body class="bg-kokarteBg text-kokarteText min-h-screen font-body">

    <!-- Vídeo de Fundo -->
    <video id="background-video" autoplay muted loop playsinline preload="auto">
        <source src="fundomotion.mp4" type="video/mp4">
    </video>

    <div class="relative z-10 max-w-md mx-auto p-6 space-y-8">
        
        <!-- Header -->
        <header class="pt-6 fade-in">
            <a href="index.html" class="inline-flex items-center gap-2 text-kokarteGold/70 hover:text-white transition-colors text-sm font-sans tracking-wider mb-6">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path>
                </svg>
                Voltar ao Portal
            </a>
            <h1 class="text-3xl font-bold text-kokarteGold font-display">Eventos & Workshops</h1>
            <div class="divider-gold my-3"></div>
            <p class="text-emerald-100/60 text-sm font-body mt-2">Participe nas nossas experiências presenciais.</p>
        </header>

        <!-- Lista de Eventos -->
        <div id="lista-eventos-detalhada" class="space-y-6 fade-in fade-in-delay-1">
            <!-- Os eventos serão carregados aqui -->
            <div class="text-center p-10 glass-premium rounded-2xl">
                <p class="text-kokarteGold animate-pulse font-sans text-sm">A carregar eventos...</p>
            </div>
        </div>
    </div>

    <script>
        const NUMERO_WHATSAPP = "244936676628";

        function carregarEventos() {
            const container = document.getElementById("lista-eventos-detalhada");
            let eventos = [];

            try {
                const dados = localStorage.getItem("kokarte_eventos");
                eventos = dados ? JSON.parse(dados) : [];
            } catch (e) {
                console.error("Erro ao ler eventos:", e);
            }

            const ativos = eventos.filter(evt => evt.ativo);

            if (ativos.length === 0) {
                container.innerHTML = `
                    <div class="glass-premium p-8 rounded-2xl text-center">
                        <p class="text-emerald-200/60 font-body">Não existem eventos agendados de momento. Fique atenta às nossas redes sociais!</p>
                    </div>
                `;
                return;
            }

            container.innerHTML = "";
            ativos.forEach((evt, index) => {
                const textoCompleto = evt.descricaoCompleta || evt.descricaoBreve || evt.descricao || "";
                const delay = (index + 1) * 0.1;
                
                container.innerHTML += `
                    <div class="glass-premium rounded-2xl overflow-hidden fade-in" style="animation-delay: ${delay}s">
                        ${evt.imagem ? `<img src="${evt.imagem}" class="w-full h-48 object-cover opacity-90">` : ''}
                        <div class="p-6">
                            <h3 class="text-xl font-bold text-white font-display mb-2">${evt.titulo}</h3>
                            <p class="text-xs text-kokarteGold font-semibold mb-4 uppercase tracking-wider font-sans">📅 ${evt.data} | 📍 ${evt.local}</p>
                            <div class="divider-gold mb-4"></div>
                            <p class="text-emerald-50 text-sm font-body leading-relaxed mb-6 whitespace-pre-line">${textoCompleto}</p>
                            <!-- Botão agora com rounded-full e Montserrat garantido -->
                            <button onclick="agendarWhatsApp('Evento: ${evt.titulo}')" 
                                    class="btn-gold-primary">
                                Garantir vaga no evento
                            </button>
                        </div>
                    </div>
                `;
            });
        }

        function agendarWhatsApp(nomeItem) {
            const mensagem = `Olá! Gostaria de reservar lugar para: *${nomeItem}*.`;
            const urlWhatsApp = `https://wa.me/${NUMERO_WHATSAPP}?text=${encodeURIComponent(mensagem)}`;
            window.open(urlWhatsApp, "_blank");
        }

        document.addEventListener("DOMContentLoaded", carregarEventos);
    </script>
</body>
</html>
